baseURL: "https://nitpitch.app/"
locale: "en-US"
title: "Nitpitch"

# Clean URLs; no taxonomies needed for a small marketing/support site.
disableKinds:
  - taxonomy
  - term
  - RSS

params:
  tagline: "A tuner for violin, guitar, bass, and more — on iPhone, iPad, and Mac."
  # Region-agnostic Universal Purchase link (one link serves iPhone/iPad/Mac):
  # no country code, so the store sends each visitor to their own storefront.
  appStoreURL: "https://apps.apple.com/app/id6796988974"
  supportEmail: ""
  githubURL: "https://github.com/vlumi/nitpitch"
  sponsorURL: "https://github.com/sponsors/vlumi"

menu:
  main:
    - name: "Guide"
      pageRef: "/guide"
      weight: 3
    - name: "Tunings"
      pageRef: "/tunings"
      weight: 5
    - name: "Support"
      pageRef: "/support"
      weight: 10
    - name: "Privacy"
      pageRef: "/privacy"
      weight: 20
